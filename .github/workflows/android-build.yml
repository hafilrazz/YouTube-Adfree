name: Build Android APK

on:
  release:
    types: [created]
  workflow_dispatch: # Allows manual triggering for testing

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install Dependencies
        run: |
          set -eo pipefail
          bun install 2>&1 | tee /tmp/install.log

      - name: Build Web App
        run: |
          set -eo pipefail
          echo "PWD: $(pwd)"
          bun run build 2>&1 | tee /tmp/build.log
          echo "build exit: ${PIPESTATUS[0]}"

      - name: Verify build output
        run: |
          echo "---- dist tree ----"
          find dist -maxdepth 5 2>/dev/null | sort || echo "dist/ missing"
          echo "---- .output tree (legacy) ----"
          find .output -maxdepth 5 2>/dev/null | sort || echo ".output/ missing"
          if [ ! -d dist/client/assets ]; then
            echo "::error::dist/client/assets missing after build. Tail of build log:"
            tail -n 100 /tmp/build.log || true
            exit 1
          fi

      - name: Upload dist for inspection
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dist-full
          path: |
            dist
            /tmp/build.log
          if-no-files-found: warn
          include-hidden-files: true

      - name: Ensure index.html for Capacitor
        run: |
          set -eo pipefail
          WEB_DIR="dist/client"

          ENTRY_JS=$(find "$WEB_DIR/assets" -type f -name "index-*.js" ! -name "*.map" | sort | head -n 1)
          if [ -z "$ENTRY_JS" ]; then
            ENTRY_JS=$(find "$WEB_DIR/assets" -type f -name "*.js" ! -name "*.map" | sort | head -n 1)
          fi

          CSS_PATH=$(find "$WEB_DIR/assets" -type f -name "*.css" ! -name "*.map" | sort | head -n 1)

          if [ -z "$ENTRY_JS" ]; then
            echo "::error::No JS bundle found in $WEB_DIR/assets"
            find "$WEB_DIR" -maxdepth 3 || true
            exit 1
          fi

          ENTRY_REL="/${ENTRY_JS#$WEB_DIR/}"
          CSS_TAG=""
          if [ -n "$CSS_PATH" ]; then
            CSS_TAG="<link rel=\"stylesheet\" href=\"/${CSS_PATH#$WEB_DIR/}\">"
          fi

          echo "Entry JS: $ENTRY_REL"
          echo "CSS: ${CSS_PATH:-none}"

          cat <<EOF > "$WEB_DIR/index.html"
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
            <title>YouTube Premium</title>
            $CSS_TAG
          </head>
          <body>
            <div id="app"></div>
            <script type="module" src="$ENTRY_REL"></script>
          </body>
          </html>
          EOF

          cat "$WEB_DIR/index.html"

      - name: Capacitor Sync
        run: bunx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          rm -f local.properties
          ./gradlew assembleRelease

      - name: Upload APK as Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
