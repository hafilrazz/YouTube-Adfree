name: Build Android APK

on:
  release:
    types: [created]
  workflow_dispatch: # Allows manual triggering for testing

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install Dependencies
        run: bun install

      - name: Build Web App
        run: bun run build

      - name: Ensure index.html for Capacitor
        run: |
          # Create directories if they don't exist
          mkdir -p dist/client/assets

          # Find the actual index JS file
          ENTRY_JS=$(find dist/client/assets -name "index-*.js" | head -n 1)
          if [ -z "$ENTRY_JS" ]; then
            ENTRY_JS=$(find dist/client/assets -name "*.js" | head -n 1)
          fi
          
          ENTRY_FILE=$(basename "$ENTRY_JS")
          CSS_FILE=$(find dist/client/assets -name "*.css" | head -n 1 | xargs basename)

          echo "Found entry JS: $ENTRY_FILE"
          echo "Found CSS: $CSS_FILE"

          # Create a functional index.html for Capacitor
          cat <<EOF > dist/client/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
            <title>YouTube Premium</title>
            <link rel="stylesheet" href="/assets/$CSS_FILE">
          </head>
          <body>
            <div id="app"></div>
            <script type="module" src="/assets/$ENTRY_FILE"></script>
          </body>
          </html>
          EOF

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          # Ensure local.properties doesn't interfere
          rm -f local.properties
          ./gradlew assembleRelease

      - name: Upload APK as Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
