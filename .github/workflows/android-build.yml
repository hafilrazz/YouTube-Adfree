name: Build Android APK

on:
  release:
    types: [created]
  workflow_dispatch: # Allows manual triggering for testing

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install Dependencies
        run: bun install

      - name: Build Web App
        run: bun run build

      - name: Ensure index.html for Capacitor
        run: |
          set -euo pipefail

          WEB_DIR="dist/client"
          mkdir -p "$WEB_DIR"

          debug_dist() {
            echo "---- Debug listing under dist/ ----"
            if [ -d dist ]; then
              find dist -maxdepth 4 -type f | sort || true
            else
              echo "dist/ does not exist"
            fi
            echo "---- End debug listing ----"
          }

          find_bundle() {
            local search_dir="$1"
            local pattern="$2"
            find "$search_dir" -type f -name "$pattern" ! -name "*.map" | sort | head -n 1
          }

          ENTRY_JS=""
          CSS_PATH=""
          ASSET_ROOT=""

          for candidate_dir in "$WEB_DIR/assets" "$WEB_DIR" "dist/assets" "dist"; do
            if [ ! -d "$candidate_dir" ]; then
              continue
            fi

            js_candidate=$(find_bundle "$candidate_dir" "index-*.js")
            if [ -z "$js_candidate" ]; then
              js_candidate=$(find_bundle "$candidate_dir" "*.js")
            fi
            css_candidate=$(find_bundle "$candidate_dir" "*.css")

            if [ -n "$js_candidate" ] && [ -n "$css_candidate" ]; then
              ENTRY_JS="$js_candidate"
              CSS_PATH="$css_candidate"
              ASSET_ROOT="$candidate_dir"
              break
            fi
          done

          if [ -z "$ENTRY_JS" ] || [ -z "$CSS_PATH" ]; then
            echo "::error::Could not find both JavaScript and CSS build assets under dist/. Ensure 'bun run build' produced client files."
            debug_dist
            exit 1
          fi

          if [[ "$ENTRY_JS" != "$WEB_DIR/"* ]] || [[ "$CSS_PATH" != "$WEB_DIR/"* ]]; then
            echo "Detected assets outside $WEB_DIR. Mirroring $ASSET_ROOT into $WEB_DIR/assets for Capacitor."
            mkdir -p "$WEB_DIR/assets"
            cp -R "$ASSET_ROOT"/. "$WEB_DIR/assets/"
            ENTRY_JS="$WEB_DIR/assets/$(basename "$ENTRY_JS")"
            CSS_PATH="$WEB_DIR/assets/$(basename "$CSS_PATH")"
          fi

          ENTRY_FILE=$(basename "$ENTRY_JS")
          CSS_FILE=$(basename "$CSS_PATH")

          ENTRY_REL_DIR=$(dirname "${ENTRY_JS#$WEB_DIR/}")
          CSS_REL_DIR=$(dirname "${CSS_PATH#$WEB_DIR/}")

          if [ "$ENTRY_REL_DIR" = "." ]; then
            ENTRY_SRC="/$ENTRY_FILE"
          else
            ENTRY_SRC="/$ENTRY_REL_DIR/$ENTRY_FILE"
          fi

          if [ "$CSS_REL_DIR" = "." ]; then
            CSS_HREF="/$CSS_FILE"
          else
            CSS_HREF="/$CSS_REL_DIR/$CSS_FILE"
          fi

          echo "Using asset root: $ASSET_ROOT"
          echo "Found entry JS: $ENTRY_JS"
          echo "Found CSS: $CSS_PATH"

          # Create a functional index.html for Capacitor
          cat <<EOF > "$WEB_DIR/index.html"
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
            <title>YouTube Premium</title>
            <link rel="stylesheet" href="$CSS_HREF">
          </head>
          <body>
            <div id="app"></div>
            <script type="module" src="$ENTRY_SRC"></script>
          </body>
          </html>
          EOF

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          # Ensure local.properties doesn't interfere
          rm -f local.properties
          ./gradlew assembleRelease

      - name: Upload APK as Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
