name: Build Android APK

on:
  release:
    types: [created]
  workflow_dispatch: # Allows manual triggering for testing

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install Dependencies
        run: bun install

      - name: Build Web App
        run: |
          bun run build
          # Final check to ensure directory exists for artifact upload
          mkdir -p dist/client

      - name: List dist tree
        run: |
          echo "---- dist tree ----"
          find dist -maxdepth 5 | sort || echo "dist/ missing"

      - name: Upload dist/client for inspection
        uses: actions/upload-artifact@v4
        with:
          name: dist-client
          path: dist/client
          if-no-files-found: warn
          include-hidden-files: true

      - name: Upload full dist for inspection
        uses: actions/upload-artifact@v4
        with:
          name: dist-full
          path: dist
          if-no-files-found: warn
          include-hidden-files: true



      - name: Ensure index.html for Capacitor
        run: |
          set -euo pipefail
          
          # In TanStack Start v1, the browser assets are in dist/client
          WEB_DIR="dist/client"
          mkdir -p "$WEB_DIR"
          
          echo "Checking directory: $WEB_DIR"
          ls -R "$WEB_DIR" || echo "Directory $WEB_DIR not found!"

          # Find entry assets
          # We look for the main JS and CSS bundles
          ENTRY_JS=$(find "$WEB_DIR/assets" -type f -name "index-*.js" ! -name "*.map" | sort | head -n 1)
          if [ -z "$ENTRY_JS" ]; then
            ENTRY_JS=$(find "$WEB_DIR/assets" -type f -name "*.js" ! -name "*.map" | sort | head -n 1)
          fi
          
          CSS_PATH=$(find "$WEB_DIR/assets" -type f -name "styles-*.css" ! -name "*.map" | sort | head -n 1)
          if [ -z "$CSS_PATH" ]; then
            CSS_PATH=$(find "$WEB_DIR/assets" -type f -name "*.css" ! -name "*.map" | sort | head -n 1)
          fi

          if [ -z "$ENTRY_JS" ] || [ -z "$CSS_PATH" ]; then
            echo "::error::Could not find build assets in $WEB_DIR/assets"
            find dist -maxdepth 4 || true
            exit 1
          fi

          # Get relative paths for index.html
          # Strip the WEB_DIR prefix to get the relative path within the web root
          ENTRY_REL="/${ENTRY_JS#$WEB_DIR/}"
          CSS_REL="/${CSS_PATH#$WEB_DIR/}"

          echo "Using Entry JS: $ENTRY_REL"
          echo "Using CSS: $CSS_REL"

          # Create index.html
          cat <<EOF > "$WEB_DIR/index.html"
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
            <title>YouTube Premium</title>
            <link rel="stylesheet" href="$CSS_REL">
          </head>
          <body>
            <div id="app"></div>
            <script type="module" src="$ENTRY_REL"></script>
          </body>
          </html>
          EOF

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          # Ensure local.properties doesn't interfere
          rm -f local.properties
          ./gradlew assembleRelease

      - name: Upload APK as Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
