name: Build Android APK

on:
  release:
    types: [created]
  workflow_dispatch: # Allows manual triggering for testing

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install Dependencies
        run: |
          set -eo pipefail
          bun install 2>&1 | tee /tmp/install.log

      - name: Verify Capacitor Shell
        run: |
          test -f capacitor-web/index.html
          grep -q 'https://ytclone2.lovable.app' capacitor.config.ts

      - name: Capacitor Sync
        run: bunx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          rm -f local.properties
          ./gradlew assembleRelease

      - name: Upload APK as Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
