name: Build Android APK

on:
  release:
    types: [created]
  workflow_dispatch: # Allows manual triggering for testing

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install Dependencies
        run: bun install

      - name: Build Web App
        run: bun run build

      - name: Ensure index.html for Capacitor
        run: |
          # TanStack Start/Nitro writes browser assets to .output/public.
          # Capacitor expects files in webDir (dist/client), so mirror them when needed.
          if [ -d .output/public ]; then
            mkdir -p dist/client
            cp -a .output/public/. dist/client/
          fi

          if [ ! -f dist/client/index.html ]; then
            # Find any built JS entry and wire a minimal index.html for Capacitor.
            ENTRY_JS=$(find dist/client -type f -name "*.js" | head -n 1 || true)
            if [ -z "$ENTRY_JS" ]; then
              echo "Error: Could not find any JS bundle in dist/client after build"
              exit 1
            fi
            ENTRY_PATH="/${ENTRY_JS#dist/client/}"
            echo "<!DOCTYPE html><html><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"><title>YouTube Premium</title></head><body><div id=\"app\"></div><script type=\"module\" src=\"$ENTRY_PATH\"></script></body></html>" > dist/client/index.html
          fi

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK as Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
