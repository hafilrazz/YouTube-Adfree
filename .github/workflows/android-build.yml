name: Build Android APK

on:
  release:
    types: [created]
  workflow_dispatch: # Allows manual triggering for testing

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install Dependencies
        run: bun install

      - name: Build Web App
        run: bun run build

      - name: Ensure index.html for Capacitor
        run: |
          # Create directories if they don't exist
          mkdir -p dist/client/assets

          # Create a functional index.html that works for both web and Capacitor
          # We use a script to find the correct entry point dynamically
          cat <<EOF > dist/client/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>YouTube Premium</title>
          </head>
          <body>
            <div id="app"></div>
            <script type="module">
              // Dynamically find and load the entry script
              fetch('/assets/manifest.json')
                .then(r => r.json())
                .then(manifest => {
                  const entry = manifest['src/main.tsx'] || Object.values(manifest).find(v => v.isEntry);
                  if (entry) {
                    const script = document.createElement('script');
                    script.type = 'module';
                    script.src = '/' + entry.file;
                    document.body.appendChild(script);
                  }
                })
                .catch(() => {
                  // Fallback: Try to find any JS file that looks like an entry point
                  const scripts = ['/assets/index.js', '/assets/start.js'];
                  scripts.forEach(src => {
                    const script = document.createElement('script');
                    script.type = 'module';
                    script.src = src;
                    document.body.appendChild(script);
                  });
                });
            </script>
          </body>
          </html>
          EOF


      - name: Capacitor Sync
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK as Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
