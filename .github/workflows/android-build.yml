name: Build Android APK
on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          # Relies on package-lock.json committed at repo root.

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Install Android command-line tools and SDK components
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${RUNNER_TEMP}/android-sdk"
          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
          curl -fSL "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip" -o cmdline.zip
          unzip -q cmdline.zip -d "${ANDROID_SDK_ROOT}/cmdline-tools"
          mv "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools" "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${PATH}"

          # Licenses must be accepted before sdkmanager will install any
          # package that needs them - do not reorder this before install.
          #
          # pipefail is disabled for this one line on purpose: sdkmanager
          # exits 0 once it has processed all licenses, but the still-running
          # `yes` process gets SIGPIPE when sdkmanager stops reading stdin.
          # Under pipefail that abnormal `yes` exit is what fails the
          # pipeline, even though licenses were accepted successfully.
          set +o pipefail
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses
          set -o pipefail

          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Prepare local.properties for Gradle
        run: |
          mkdir -p android
          echo "sdk.dir=${RUNNER_TEMP}/android-sdk" > android/local.properties

      - name: Install Node dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Capacitor Sync
        run: npx cap sync android

      # Requires 4 repo secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD,
      # KEY_ALIAS, KEY_PASSWORD - and a matching signingConfigs block in
      # android/app/build.gradle. See setup notes in the repo README.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Build Android APK
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      # A build type with a signingConfig assigned produces app-release.apk
      # (no "-unsigned" suffix) - this is the signed, installable APK.
      - name: Upload APK as Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error